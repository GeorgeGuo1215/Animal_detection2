<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PetMind 会诊手记</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *{box-sizing:border-box}html,body{margin:0;height:100%}
    :root{--bg:#eee5d5;--paper:#fffaf0;--paper-soft:#f7efe1;--paper-deep:#ecdfcd;--line:#b9a78e;--line-soft:#d9cbb7;--ink:#3f382f;--muted:#786d5f;--terracotta:#b7684e;--terracotta-dark:#8f4f3b;--sage:#7d8a69;--ochre:#c79550;--danger:#a64e49;--radius:14px}
    body{font-family:"Noto Serif SC","Songti SC",STSong,Georgia,serif;color:var(--ink);background:radial-gradient(circle at 12% 8%,rgba(255,250,240,.88),transparent 34%),radial-gradient(circle at 86% 16%,rgba(199,149,80,.12),transparent 30%),linear-gradient(115deg,rgba(117,92,61,.035) 1px,transparent 1px),var(--bg);background-size:auto,auto,7px 7px,auto;display:flex;flex-direction:column;overflow:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;background-image:repeating-linear-gradient(3deg,transparent 0 5px,rgba(89,72,51,.018) 6px 7px),repeating-linear-gradient(87deg,transparent 0 13px,rgba(255,255,255,.1) 14px 15px);mix-blend-mode:multiply}
    ::selection{background:#e7c3a7;color:var(--ink)}button,textarea,input{font:inherit}button{color:inherit}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid rgba(183,104,78,.45);outline-offset:2px}
    header{height:72px;flex:none;display:flex;align-items:center;gap:14px;padding:0 24px;border-bottom:1px solid var(--line);background:rgba(255,250,240,.92);box-shadow:0 3px 0 rgba(103,84,61,.07),0 9px 24px rgba(83,60,35,.06);z-index:5;position:relative}
    header:after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:3px;background:linear-gradient(90deg,transparent 2%,rgba(109,88,65,.2) 8% 43%,transparent 48% 52%,rgba(109,88,65,.16) 58% 94%,transparent);transform:rotate(-.08deg)}
    .brand{display:flex;align-items:center;gap:11px}.brand-mark{width:38px;height:38px;border:1.5px solid var(--terracotta-dark);border-radius:50% 46% 52% 45%;display:grid;place-items:center;background:#f7e6d3;color:var(--terracotta-dark);font-size:18px;transform:rotate(-4deg);box-shadow:2px 2px 0 rgba(143,79,59,.18)}
    .brand h1{font-size:17px;margin:0;letter-spacing:.08em;font-weight:700}.brand small{display:block;color:var(--muted);font:10px "Noto Sans SC","Segoe UI",sans-serif;letter-spacing:.12em;margin-top:3px}
    .toolbar{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:"Noto Sans SC","Segoe UI",sans-serif}.segmented,.user-chip{border:1px solid var(--line);border-radius:9px;background:rgba(247,239,225,.9);display:flex;padding:3px;gap:2px;box-shadow:inset 0 1px rgba(255,255,255,.65),1px 2px 0 rgba(83,60,35,.05)}
    .segmented button,.ghost{border:0;background:transparent;border-radius:6px;padding:7px 10px;font-size:12px;cursor:pointer;color:var(--muted);transition:transform .18s ease,background .18s ease,color .18s ease,border-color .18s ease}.segmented button:hover,.ghost:hover{color:var(--terracotta-dark);transform:translateY(-1px)}.segmented button.active{background:#ead1bb;color:var(--terracotta-dark);box-shadow:inset 0 0 0 1px rgba(143,79,59,.16)}.ghost{border:1px solid var(--line);color:var(--ink);background:rgba(255,250,240,.72);box-shadow:1px 2px 0 rgba(83,60,35,.08)}
    .user-chip{align-items:center;padding:6px 9px;font-size:12px;cursor:pointer}.online-dot{width:8px;height:8px;border-radius:50%;background:var(--sage);border:1px solid #687456;box-shadow:0 0 0 3px rgba(125,138,105,.12)}.memory-label{color:var(--muted);font-size:10px}
    #chat{flex:1;overflow:auto;padding:32px 20px 194px;scroll-behavior:smooth;position:relative}.stream{max-width:980px;margin:auto;display:flex;flex-direction:column;gap:24px}
    .welcome{position:relative;border:1px solid var(--line);border-radius:18px 15px 20px 16px;padding:38px;background:linear-gradient(138deg,rgba(255,250,240,.98),rgba(247,239,225,.94));box-shadow:4px 5px 0 rgba(116,91,62,.1),0 20px 45px rgba(83,60,35,.08);animation:rise .45s ease both}
    .welcome:before{content:"";position:absolute;inset:7px;border:1px solid rgba(128,103,74,.14);border-radius:13px 11px 16px 12px;pointer-events:none;transform:rotate(.08deg)}.welcome:after{content:"✎";position:absolute;right:28px;top:22px;color:rgba(143,79,59,.32);font-size:27px;transform:rotate(-9deg)}
    .eyebrow{display:inline-block;position:relative;font:600 11px "Noto Sans SC","Segoe UI",sans-serif;color:var(--terracotta-dark);letter-spacing:.13em}.eyebrow:after{content:"";position:absolute;left:-2px;right:-6px;bottom:-5px;height:4px;border-top:1px solid rgba(143,79,59,.48);border-radius:50%;transform:rotate(-1deg)}
    .welcome h2{font-size:30px;margin:15px 0 10px;line-height:1.35}.welcome p{color:var(--muted);line-height:1.9;max-width:720px;margin:0}.examples{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.examples button{border:1px solid var(--line);background:rgba(255,250,240,.75);border-radius:999px;padding:9px 14px;color:#665b4e;cursor:pointer;font:12px "Noto Sans SC","Segoe UI",sans-serif;box-shadow:1px 2px 0 rgba(83,60,35,.07);transition:.18s ease}.examples button:before{content:"•";color:var(--terracotta);margin-right:7px}.examples button:hover{border-color:var(--terracotta);color:var(--terracotta-dark);background:#fbefe2;transform:translateY(-1px)}
    .turn{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}.user-row{display:flex;justify-content:flex-end;margin-bottom:13px}.user-bubble{position:relative;max-width:78%;padding:13px 17px;background:#ead0b7;border:1px solid #bd8d72;border-radius:17px 17px 5px 17px;white-space:pre-wrap;line-height:1.7;box-shadow:2px 3px 0 rgba(143,79,59,.1)}.user-bubble:after{content:"";position:absolute;right:9px;bottom:-5px;width:17px;height:7px;border-bottom:1px solid rgba(143,79,59,.36);border-radius:50%;transform:rotate(-8deg)}
    .workbench{position:relative;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:rgba(255,250,240,.96);box-shadow:3px 4px 0 rgba(116,91,62,.1),0 16px 38px rgba(83,60,35,.07)}.workbench:after{content:"";position:absolute;inset:5px;z-index:0;border:1px solid rgba(128,103,74,.09);border-radius:10px;pointer-events:none}.trace-head,.trace-body,.answer,.turn-actions{position:relative;z-index:1}.trace-head{width:100%;border:0;background:linear-gradient(90deg,rgba(199,149,80,.14),rgba(247,239,225,.3));padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left}.trace-head strong{font-size:12px;letter-spacing:.06em}.trace-head .phase{color:var(--muted);font:10px "Noto Sans SC","Segoe UI",sans-serif;letter-spacing:.05em;margin-left:auto}.chevron{transition:.22s;color:var(--terracotta-dark);font-weight:700}.workbench.collapsed .chevron{transform:rotate(-90deg)}
    .trace-body{display:grid;grid-template-columns:minmax(220px,.65fr) minmax(300px,1.35fr);align-items:start;border-top:1px dashed var(--line);max-height:min(620px,68vh);overflow:auto;overscroll-behavior:contain;transition:max-height .28s ease,opacity .2s;background:rgba(247,239,225,.34)}.workbench.collapsed .trace-body{max-height:0;opacity:0;border-top:0;overflow:hidden}.timeline{padding:18px 16px;border-right:1px dashed var(--line);min-width:0;min-height:150px}.timeline-item{position:relative;padding:0 0 17px 26px;color:var(--muted);font:11px/1.65 "Noto Sans SC","Segoe UI",sans-serif;animation:fade .25s ease both}.timeline-item:before{content:"";position:absolute;left:4px;top:5px;width:9px;height:9px;border-radius:48% 52% 45% 55%;background:#c3b49f;border:1.5px solid #8f806c;box-shadow:0 0 0 3px var(--paper-soft)}.timeline-item:after{content:"";position:absolute;left:8px;top:18px;bottom:0;border-left:1px dashed rgba(109,91,70,.48)}.timeline-item:nth-child(even):after{transform:rotate(.5deg)}.timeline-item:last-child:after{display:none}.timeline-item.active:before{background:var(--ochre);border-color:#9f7338;animation:pulse 1.5s infinite}.timeline-item.done:before{background:var(--sage);border-color:#667153}.timeline-item.error:before{background:var(--danger);border-color:#813a37}.timeline-item b{display:block;color:var(--ink);font-weight:650}
    .expert-zone{padding:17px;display:flex;flex-direction:column;gap:11px;min-width:0}.empty-experts{color:var(--muted);font:12px "Noto Sans SC","Segoe UI",sans-serif;padding:25px 5px}.empty-experts:before{content:"○";margin-right:8px;color:var(--ochre)}.expert-card{position:relative;border:1px solid var(--line-soft);border-radius:9px 12px 10px 8px;background:rgba(255,252,245,.92);overflow:hidden;box-shadow:2px 3px 0 rgba(94,72,47,.06);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}.expert-card:before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;background:var(--ochre);border-radius:0 3px 3px 0}.expert-card.complete:before{background:var(--sage)}.expert-card:hover{border-color:#b88b71;transform:translateY(-1px);box-shadow:3px 4px 0 rgba(94,72,47,.08)}.expert-head{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;padding:11px 13px;cursor:pointer}.expert-icon{width:30px;height:30px;border:1px solid #caa888;border-radius:50% 46% 52% 44%;display:grid;place-items:center;background:#f6e5d3;color:var(--terracotta-dark);transform:rotate(-3deg)}.expert-title{font-size:13px;font-weight:650}.expert-meta{color:var(--muted);font:10px "Noto Sans SC","Segoe UI",sans-serif;margin-top:3px;overflow-wrap:anywhere}.expert-state{font:10px "Noto Sans SC","Segoe UI",sans-serif;color:var(--terracotta-dark);letter-spacing:.05em}.expert-card.running .expert-state{animation:blink 1.1s infinite}.expert-card.complete .expert-state{color:#697557}.expert-detail{display:none;border-top:1px dashed var(--line);padding:13px;color:#5f5549;font:11px/1.7 "Noto Sans SC","Segoe UI",sans-serif;background:rgba(247,239,225,.52)}.expert-card.open .expert-detail{display:block;animation:fade .25s ease}.detail-block{margin:0 0 11px}.detail-block:last-child{margin-bottom:0}.detail-block label{display:block;color:var(--terracotta-dark);font-size:10px;font-weight:650;margin-bottom:5px;letter-spacing:.08em;text-transform:uppercase}.detail-json{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;background:rgba(255,250,240,.9);border:1px solid var(--line-soft);border-radius:6px;padding:10px;max-height:210px;overflow:auto}
    .answer{position:relative;z-index:1;padding:22px 24px;line-height:1.9;color:var(--ink);background:rgba(255,250,240,.98);min-height:66px;border-top:1px solid var(--line);overflow-wrap:anywhere}.answer:before{content:"答";float:left;margin:2px 12px 4px 0;width:28px;height:28px;display:grid;place-items:center;border:1px solid rgba(143,79,59,.5);border-radius:50% 46% 52% 45%;color:var(--terracotta-dark);font-size:12px;transform:rotate(-5deg)}.answer:empty:after{content:"";display:block;width:70%;height:14px;border-radius:4px;background:linear-gradient(90deg,#eadfce,#f7efe1,#eadfce);background-size:200% 100%;animation:shimmer 1.4s infinite}.answer.streaming:after{content:"│";color:var(--terracotta);animation:blink .8s infinite}.answer h1,.answer h2,.answer h3{color:var(--terracotta-dark);line-height:1.45}.answer h2,.answer h3{border-bottom:1px dashed rgba(143,79,59,.3);padding-bottom:5px}.answer a{color:#8a5c3f;text-decoration-color:rgba(138,92,63,.4);text-underline-offset:3px}.answer blockquote{margin:14px 0;padding:9px 15px;border-left:3px solid var(--ochre);background:#f8eddd;color:#625747}.answer code{color:#7c4939;background:#f0e2cf;padding:2px 5px;border-radius:4px}.answer pre{background:#f5ead9;border:1px solid var(--line-soft);padding:13px;border-radius:8px;overflow:auto}.answer table{width:100%;border-collapse:collapse;margin:14px 0;font-size:.92em}.answer th,.answer td{border:1px solid var(--line-soft);padding:8px 10px;text-align:left}.answer th{background:#f0dfca;color:var(--terracotta-dark)}.answer li::marker{color:var(--terracotta)}.turn-actions{display:flex;justify-content:flex-end;padding:0 16px 13px;background:var(--paper)}.turn-actions button{border:0;border-bottom:1px dashed transparent;background:transparent;color:var(--muted);font:11px "Noto Sans SC","Segoe UI",sans-serif;cursor:pointer;padding:6px}.turn-actions button:before{content:"↧";margin-right:5px}.turn-actions button:hover{color:var(--terracotta-dark);border-bottom-color:rgba(143,79,59,.35)}
    #composer{position:fixed;left:0;right:0;bottom:0;padding:27px 20px 20px;background:linear-gradient(transparent,rgba(238,229,213,.95) 28%,var(--bg) 62%);z-index:4}.composer-inner{position:relative;max-width:980px;margin:auto;border:1px solid var(--line);border-radius:14px 17px 13px 16px;padding:9px;background:rgba(255,250,240,.97);display:flex;align-items:flex-end;gap:9px;box-shadow:3px 4px 0 rgba(116,91,62,.11),0 18px 40px rgba(83,60,35,.12)}.composer-inner:before{content:"";position:absolute;left:21px;right:70px;bottom:15px;border-bottom:1px solid rgba(115,94,69,.09);pointer-events:none}textarea{position:relative;z-index:1;flex:1;resize:none;border:0;outline:0;color:var(--ink);background:transparent;padding:10px 12px;max-height:150px;line-height:1.65}textarea::placeholder{color:#a09280}.send{width:46px;height:46px;border:1px solid var(--terracotta-dark);border-radius:50% 45% 52% 47%;cursor:pointer;background:var(--terracotta);color:#fffaf0;font-size:19px;font-weight:800;box-shadow:2px 3px 0 rgba(116,66,50,.2);transform:rotate(-2deg);transition:.18s ease}.send:hover:not(:disabled){background:var(--terracotta-dark);transform:rotate(0) translateY(-1px)}.send:disabled{filter:saturate(.45);opacity:.42;cursor:not-allowed}.composer-note{text-align:center;color:#8a7e6e;font:10px "Noto Sans SC","Segoe UI",sans-serif;margin-top:9px;letter-spacing:.03em}
    .modal{position:fixed;inset:0;z-index:20;background:rgba(77,62,44,.54);display:grid;place-items:center;padding:20px}.modal.hidden{display:none}.login-card{position:relative;width:min(440px,100%);border:1px solid var(--line);border-radius:18px 15px 21px 16px;padding:32px;background:linear-gradient(145deg,#fffaf0,#f5e9d7);box-shadow:5px 7px 0 rgba(72,54,35,.17),0 35px 90px rgba(51,37,23,.28);animation:rise .35s ease}.login-card:before{content:"";position:absolute;width:86px;height:24px;top:-10px;left:50%;transform:translateX(-50%) rotate(-2deg);background:rgba(223,195,151,.7);border-left:1px solid rgba(138,105,66,.12);border-right:1px solid rgba(138,105,66,.12)}.login-card:after{content:"";position:absolute;inset:7px;border:1px solid rgba(128,103,74,.12);border-radius:13px;pointer-events:none}.login-card>*{position:relative;z-index:1}.login-card h2{margin:15px 0 8px}.login-card p{color:var(--muted);font-size:13px;line-height:1.8}.login-card input{width:100%;margin-top:16px;border:1px solid var(--line);border-radius:9px;background:rgba(255,252,246,.9);color:var(--ink);padding:12px 13px;outline:none;box-shadow:inset 1px 2px 0 rgba(89,68,44,.04)}.login-card input:focus{border-color:var(--terracotta);box-shadow:0 0 0 3px rgba(183,104,78,.1)}.login-card .primary{width:100%;margin-top:10px;border:1px solid var(--terracotta-dark);border-radius:9px;padding:12px;background:var(--terracotta);color:#fffaf0;font-weight:700;cursor:pointer;box-shadow:2px 3px 0 rgba(116,66,50,.18)}.login-card .primary:hover{background:var(--terracotta-dark)}.login-error{min-height:18px;color:var(--danger);font-size:11px;margin-top:8px}
    @keyframes rise{from{opacity:0;transform:translateY(12px) rotate(.15deg)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pulse{50%{transform:scale(1.18);opacity:.62}}@keyframes blink{50%{opacity:.35}}@keyframes shimmer{to{background-position:-200% 0}}
    ::-webkit-scrollbar{width:9px}::-webkit-scrollbar-track{background:rgba(236,223,205,.45)}::-webkit-scrollbar-thumb{background:#b8a78f;border:2px solid #eee5d5;border-radius:10px}
    @media(max-width:760px){header{height:auto;min-height:68px;padding:11px 12px;flex-wrap:wrap}.brand small{display:none}.toolbar{width:100%;margin:0;overflow:auto;padding-bottom:2px}.trace-body{grid-template-columns:1fr}.timeline{border-right:0;border-bottom:1px dashed var(--line)}#chat{padding:20px 10px 182px}.welcome{padding:29px 21px}.welcome h2{font-size:24px}.welcome:after{right:18px}.user-bubble{max-width:90%}.role-switch{display:none}.answer{padding:19px 17px}.composer-note{font-size:9px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <header>
    <div class="brand"><div class="brand-mark">🐾</div><div><h1>PetMind 会诊手记</h1><small>宠物健康协作记录</small></div></div>
    <div class="toolbar">
      <div class="segmented role-switch"><button id="role-owner" class="active">宠物主</button><button id="role-vet">兽医</button></div>
      <div class="segmented"><button id="lang-zh" class="active">中文</button><button id="lang-en">EN</button></div>
      <button class="ghost" id="new-session">新会话</button>
      <div class="user-chip" id="user-chip" title="切换测试用户"><span class="online-dot"></span><span id="username-label">未登录</span><span class="memory-label" id="memory-label">记忆 --</span></div>
    </div>
  </header>
  <main id="chat"><div class="stream" id="stream"><section class="welcome" id="welcome"><div class="eyebrow">病例记录 · 专家会诊 · 安全复核</div><h2>一起理清宠物的健康问题</h2><p>每轮会诊都会留下清晰的思考记录。展开专家卡片，可以查看结论、依据与工具调用；使用同一用户名，还能在新会话和后端重启后延续长期记忆。</p><div class="examples" id="examples"></div></section></div></main>
  <div id="composer"><div class="composer-inner"><textarea id="user-input" rows="1" placeholder="描述宠物症状或提出临床问题…" disabled></textarea><button class="send" id="send-btn" disabled>↑</button></div><div class="composer-note">Enter 发送 · Shift+Enter 换行 · 记忆按用户隔离</div></div>
  <div class="modal" id="login-modal"><form class="login-card" id="login-form"><div class="eyebrow">一人一份记忆手记</div><h2>选择测试身份</h2><p>同一用户名创建的新会话会共享 PostgreSQL 长期记忆；SQLite 仍只保存当前会话的完整对话与专家执行记录。</p><input id="username-input" maxlength="80" autocomplete="username" placeholder="输入测试用户名" required><div class="login-error" id="login-error"></div><button class="primary" type="submit">开始会诊</button></form></div>
  <script>
    const streamEl=document.getElementById('stream'),chatEl=document.getElementById('chat'),inputEl=document.getElementById('user-input'),sendBtn=document.getElementById('send-btn');
    let sessionId='',username='',streaming=false,turnSequence=0,currentRole=localStorage.getItem('petmind_moe_role')||'pet_owner',currentLang=localStorage.getItem('petmind_moe_lang')||'zh';
    const turns=new Map(),expertNames={clinical:'临床专家',nutrition:'营养专家',pharmacology:'药理专家',behavior:'行为专家'};
    const examples={pet_owner:['猫咪突然不吃饭要观察哪些风险？','狗狗呕吐伴随腹泻需要马上就医吗？','请记住我的猫叫团团，下次新会话还能认出它吗？'],veterinarian:['猫下泌尿道疾病的鉴别诊断和处置优先级','慢性肾病猫的营养管理原则','犬心率异常时应核对哪些生命体征？']};
    function esc(value){const node=document.createElement('div');node.textContent=String(value??'');return node.innerHTML}
    function scroll(){chatEl.scrollTop=chatEl.scrollHeight}
    function renderExamples(){const box=document.getElementById('examples');if(!box)return;box.innerHTML='';examples[currentRole].forEach(q=>{const b=document.createElement('button');b.textContent=q;b.onclick=()=>{inputEl.value=q;inputEl.focus()};box.appendChild(b)})}
    function syncControls(){document.getElementById('role-owner').classList.toggle('active',currentRole==='pet_owner');document.getElementById('role-vet').classList.toggle('active',currentRole==='veterinarian');document.getElementById('lang-zh').classList.toggle('active',currentLang==='zh');document.getElementById('lang-en').classList.toggle('active',currentLang==='en');inputEl.placeholder=currentLang==='zh'?'描述宠物症状或提出临床问题…':'Describe symptoms or ask a clinical question…';renderExamples()}
    function setRole(role){currentRole=role;localStorage.setItem('petmind_moe_role',role);syncControls()}
    function setLang(lang){currentLang=lang;localStorage.setItem('petmind_moe_lang',lang);syncControls()}
    async function createSession(name){const resp=await fetch('/chat-moe/sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:name})});if(!resp.ok)throw new Error(`Session HTTP ${resp.status}: ${await resp.text()}`);const data=await resp.json();sessionId=data.session_id;username=data.username;localStorage.setItem('petmind_moe_username',username);document.getElementById('username-label').textContent=username;const memory=data.memory||{};document.getElementById('memory-label').textContent=memory.ensured?'记忆已连接':(memory.enabled?'记忆降级':'记忆关闭');inputEl.disabled=false;sendBtn.disabled=false;return data}
    function openLogin(){const modal=document.getElementById('login-modal');modal.classList.remove('hidden');const field=document.getElementById('username-input');field.value=username||localStorage.getItem('petmind_moe_username')||'';setTimeout(()=>field.focus(),30)}
    async function login(name){const clean=name.trim();if(!clean)throw new Error('请输入用户名');await createSession(clean);document.getElementById('login-modal').classList.add('hidden');inputEl.focus()}
    function newTurn(question){document.getElementById('welcome')?.remove();const id=`turn-${++turnSequence}-${crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)}`;const root=document.createElement('section');root.className='turn';root.id=id;root.innerHTML=`<div class="user-row"><div class="user-bubble">${esc(question)}</div></div><div class="workbench"><button class="trace-head"><span class="chevron">⌄</span><strong>本轮会诊记录</strong><span class="phase">准备中</span></button><div class="trace-body"><div class="timeline"></div><div class="expert-zone"><div class="empty-experts">等待分诊并邀请合适的专家…</div></div></div><article class="answer"></article><div class="turn-actions"><button class="download">下载本轮详情 JSON</button></div></div>`;streamEl.appendChild(root);const state={id,root,question,events:[],experts:new Map(),answer:'',intent:null,router:null,critic:null};root.querySelector('.trace-head').onclick=()=>root.querySelector('.workbench').classList.toggle('collapsed');root.querySelector('.download').onclick=()=>downloadTurn(state);turns.set(id,state);scroll();return state}
    const phaseNames={initializing:'准备中',session_context_loaded:'对话已恢复',memory_context_loaded:'记忆已加载',memory_context_skipped:'未加载长期记忆',intent_classifying:'理解问题',intent_classified:'问题已归类',routing:'邀请专家',expert_calling:'专家分析中',expert_complete:'专家已提交',reviewing:'安全复核',generating:'整理答复',memory_stored:'记忆已保存',memory_store_skipped:'未写入长期记忆',streaming:'正在回答',complete:'已完成',error:'执行异常'};
    function phaseLabel(text){const key=String(text||'');return phaseNames[key]||key}
    function setPhase(turn,text){turn.root.querySelector('.phase').textContent=phaseLabel(text)}
    function addTimeline(turn,title,detail='',kind='active'){turn.root.querySelectorAll('.timeline-item.active').forEach(n=>{n.classList.remove('active');n.classList.add('done')});const item=document.createElement('div');item.className=`timeline-item ${kind}`;item.innerHTML=`<b>${esc(title)}</b>${esc(detail)}`;turn.root.querySelector('.timeline').appendChild(item);scroll();return item}
    function expertKey(detail){return String(detail.expert||detail.name||'unknown')}
    function ensureExpert(turn,detail){const key=expertKey(detail);if(turn.experts.has(key))return turn.experts.get(key);turn.root.querySelector('.empty-experts')?.remove();const card=document.createElement('section');card.className='expert-card running';card.innerHTML=`<div class="expert-head"><div class="expert-icon">✎</div><div><div class="expert-title">${esc(detail.name_zh||expertNames[key]||key)}</div><div class="expert-meta">权重 ${esc(detail.weight??'--')} · 独立专家会诊</div></div><div class="expert-state">分析中</div></div><div class="expert-detail"><div class="detail-block"><label>当前状态</label><div>专家正在分析并按需调用工具…</div></div></div>`;card.querySelector('.expert-head').onclick=()=>card.classList.toggle('open');turn.root.querySelector('.expert-zone').appendChild(card);const expert={key,card,detail:null};turn.experts.set(key,expert);return expert}
    function renderList(value){if(!value||!value.length)return '—';return value.map(v=>typeof v==='string'?`• ${v}`:`• ${JSON.stringify(v,null,2)}`).join('\n')}
    function completeExpert(turn,detail){const expert=ensureExpert(turn,detail),opinion=detail.opinion||{};expert.detail=detail;expert.card.classList.remove('running');expert.card.classList.add('complete');expert.card.querySelector('.expert-state').textContent='已完成';expert.card.querySelector('.expert-meta').textContent=`可信度 ${detail.confidence??opinion.confidence??'--'} · 资料 ${detail.hits_count??0} · 工具 ${(detail.tools_used||opinion.tools_used||[]).length}`;const blocks=[['结论',opinion.conclusion||detail.conclusion||'—'],['依据',renderList(opinion.evidence)],['风险提示',renderList(opinion.risks)],['工具调用与结果',JSON.stringify(opinion.tool_results||[],null,2)||'—']];expert.card.querySelector('.expert-detail').innerHTML=blocks.map(([label,value])=>`<div class="detail-block"><label>${esc(label)}</label><div class="detail-json">${esc(value)}</div></div>`).join('')}
    function summary(status,detail){if(status==='session_context_loaded')return `SQLite 恢复 ${detail.complete_turns||0} 轮，专家历史 ${detail.expert_context_turns||0} 轮`;if(status==='memory_context_loaded')return `PostgreSQL 记忆已加载：近期 ${detail.recent_turns||0} 轮，知识 ${detail.knowledge_items||0} 条`;if(status==='memory_context_skipped')return `记忆未加载：${detail.reason||'无可用内容'}`;if(status==='intent_classifying')return '解析任务与意图边界';if(status==='intent_classified')return `${detail.intent_id||''} ${detail.name||''} · confidence ${detail.confidence??'--'}`;if(status==='routing')return detail.selected_experts?`激活 ${(detail.selected_experts||[]).join(', ')}`:(detail.message||'Router 决策中');if(status==='reviewing')return detail.verdict?`Critic ${detail.verdict} · ${(detail.issues||[]).join('; ')}`:(detail.message||'安全审查中');if(status==='generating')return 'Aggregator 融合专家意见';if(status==='memory_stored')return `本轮已写入用户记忆${detail.duplicate?'（幂等复用）':''}`;if(status==='memory_store_skipped')return `记忆未写入：${detail.reason||'disabled'}`;return detail.message||status||''}
    function handleEvent(turn,chunk){const status=chunk.agent_status,detail=chunk.agent_detail||{},content=chunk.choices?.[0]?.delta?.content||'',finish=chunk.choices?.[0]?.finish_reason;turn.events.push({status,detail,content,finish});if(status&&status!=='streaming'){setPhase(turn,status);if(status==='expert_calling'){ensureExpert(turn,detail);addTimeline(turn,detail.name_zh||expertNames[expertKey(detail)]||'专家节点','会诊与工具决策进行中')}else if(status==='expert_complete'){completeExpert(turn,detail);addTimeline(turn,detail.name_zh||expertNames[expertKey(detail)]||'专家节点','已提交结构化意见','done')}else{addTimeline(turn,phaseLabel(status),summary(status,detail),status==='error'?'error':(status==='memory_stored'?'done':'active'))}}if(status==='intent_classified')turn.intent=detail;if(status==='routing'&&detail.selected_experts)turn.router=detail;if(status==='reviewing'&&detail.verdict)turn.critic=detail;if(status==='streaming'&&content){turn.answer+=content;const box=turn.root.querySelector('.answer');box.classList.add('streaming');box.innerHTML=marked.parse(turn.answer);scroll()}}
    async function send(){const text=inputEl.value.trim();if(!text||streaming||!sessionId)return;streaming=true;sendBtn.disabled=true;inputEl.value='';inputEl.style.height='auto';const turn=newTurn(text);addTimeline(turn,'请求已接收',`session ${sessionId.slice(0,8)}…`);try{const resp=await fetch('/chat-moe/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId,message:text,user_role:currentRole,response_lang:currentLang,temperature:.3})});if(!resp.ok)throw new Error(`HTTP ${resp.status}: ${await resp.text()}`);const reader=resp.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const {done,value}=await reader.read();buffer+=decoder.decode(value||new Uint8Array(),{stream:!done});const lines=buffer.split('\n');buffer=done?'':lines.pop()||'';for(const raw of lines){const line=raw.trim();if(!line.startsWith('data:'))continue;const payload=line.slice(5).trim();if(!payload||payload==='[DONE]')continue;try{handleEvent(turn,JSON.parse(payload))}catch(err){console.warn('Invalid SSE payload',err,payload)}}if(done)break}setPhase(turn,'complete');turn.root.querySelectorAll('.timeline-item.active').forEach(n=>{n.classList.remove('active');n.classList.add('done')})}catch(err){setPhase(turn,'error');addTimeline(turn,'执行失败',err.message,'error');if(!turn.answer)turn.root.querySelector('.answer').textContent=`调用失败：${err.message}`}finally{turn.root.querySelector('.answer').classList.remove('streaming');streaming=false;sendBtn.disabled=false;inputEl.focus();scroll()}}
    function downloadTurn(turn){const data={session_id:sessionId,username,question:turn.question,user_role:currentRole,lang:currentLang,intent:turn.intent,router:turn.router,experts:[...turn.experts.values()].map(x=>x.detail).filter(Boolean),critic:turn.critic,events:turn.events,final_answer:turn.answer};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`petmind-moe-turn-${turn.id}.json`;a.click();URL.revokeObjectURL(a.href)}
    document.getElementById('role-owner').onclick=()=>setRole('pet_owner');document.getElementById('role-vet').onclick=()=>setRole('veterinarian');document.getElementById('lang-zh').onclick=()=>setLang('zh');document.getElementById('lang-en').onclick=()=>setLang('en');document.getElementById('user-chip').onclick=openLogin;document.getElementById('new-session').onclick=async()=>{if(streaming||!username)return;sendBtn.disabled=true;await createSession(username);sendBtn.disabled=false;addTimeline(newTurn(currentLang==='zh'?'已创建新的测试会话':'New test session created'),'新会话','同一用户名的长期记忆将继续生效','done')};
    document.getElementById('login-form').onsubmit=async event=>{event.preventDefault();const error=document.getElementById('login-error');error.textContent='';try{await login(document.getElementById('username-input').value)}catch(err){error.textContent=err.message}};sendBtn.onclick=send;inputEl.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}});inputEl.addEventListener('input',()=>{inputEl.style.height='auto';inputEl.style.height=Math.min(inputEl.scrollHeight,150)+'px'});syncControls();renderExamples();openLogin();
  </script>
