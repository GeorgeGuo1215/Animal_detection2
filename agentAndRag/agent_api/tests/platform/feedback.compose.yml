services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: feedback_test
      POSTGRES_DB: feedback_test
      POSTGRES_PASSWORD: ${PETMIND_TEST_DB_PASSWORD:?set a disposable test password}
    ports: ['127.0.0.1:15439:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U feedback_test -d feedback_test']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes: ['pg_data:/var/lib/postgresql/data']
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:16389:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pg_data:
