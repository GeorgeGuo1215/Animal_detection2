services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: petmind_agent
      POSTGRES_USER: petmind
      POSTGRES_PASSWORD: ${PETMIND_POSTGRES_PASSWORD:-petmind-dev-password}
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - petmind_agent_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petmind -d petmind_agent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - petmind_agent_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  petmind_agent_pg:
  petmind_agent_redis:
